# CI for pexafy-mcp. Two fast, network-free jobs:
#   lint  — ruff static checks
#   test  — pytest suite (offline: built from the vendored OpenAPI snapshot).
default:
  image: python:3.12-slim

stages: [lint, test]

lint:
  stage: lint
  script:
    - pip install --no-cache-dir ruff
    - ruff check src/ tests/

test:
  stage: test
  script:
    - ./run.sh setup
    - ./run.sh test
