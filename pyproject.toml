[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pexafy-mcp"
version = "1.0.0"
description = "MCP server for Pexafy's free stock photo search — by words, by image or by a Pexafy photo — with an inline result grid."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pexafy" }]
keywords = ["mcp", "model-context-protocol", "pexafy", "image-search", "stock-photos"]
dependencies = [
    # Upper bound deliberate. fastmcp 4 moved `fastmcp.tools.tool`, so a fresh build
    # against it dies at import — which is exactly what happened the first time this
    # image was rebuilt after 4.0 shipped: production still ran 3.4.7 from an older
    # layer, and nothing had warned us. An unbounded floor on a young library is not
    # a dependency, it is a scheduled outage. Moving to 4.x is its own piece of work.
    "fastmcp>=3.4,<4",    # generates the MCP server from the Pexafy OpenAPI spec
    "httpx>=0.27",        # async HTTP client to the Pexafy API
    "python-dotenv>=1.0", # loads .env (api base url, optional keys)
    "redis>=5.0",         # coach once per person, editor sign-ins (store.py); used only when PEXAFY_REDIS_URL is set
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Pinned, not floating: ruff enables new rules in new releases, so an
    # unpinned lint job starts failing on untouched code. CI installs this
    # same extra, so local and CI always run the identical checker.
    "ruff==0.15.18",
]

[project.urls]
Homepage = "https://pexafy.com"
Repository = "https://github.com/Pexafy/pexafy-mcp"
Documentation = "https://pexafy.com/mcp"

[project.scripts]
pexafy-mcp = "pexafy_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pexafy_mcp = ["assets/*.js", "assets/*.json", "assets/*.png"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
